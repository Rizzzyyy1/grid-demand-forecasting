name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # Every extra except `deep`: CI never trains N-HiTS, and Linux PyTorch wheels pull
      # several GB of CUDA libraries.
      - name: Install
        run: uv sync --frozen --extra ml --extra pipeline --extra serve --extra ui --extra monitor
      - name: Lint
        run: make lint
      - name: Types
        run: make typecheck
      - name: Architecture contracts
        run: make arch
      - name: Tests
        run: uv run --frozen pytest -m "not network and not slow" --cov --cov-report=xml
      - name: dbt parse (no data needed)
        run: cd transform && uv run --frozen dbt parse --profiles-dir .

  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
      - name: Validate OpenTofu/Terraform (no credentials needed)
        working-directory: infra/terraform
        run: |
          tofu fmt -check -recursive
          tofu init -backend=false -input=false
          tofu validate

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
